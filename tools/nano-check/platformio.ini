; Sanity check for the Arduino Nano we use as a USB-to-serial adapter.
; Our Nano is a clone with an ATmega32U4 (native USB, shows up as
; "Arduino Leonardo"), so it uses the leonardo board definition.
; The nano_old/nano_new envs are for classic ATmega328P + CH340 Nanos: most
; ship with the old bootloader; if upload fails with "not in sync", try the other.

[platformio]
default_envs = nano_32u4

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:nano_32u4]
board = leonardo

[env:nano_old]
board = nanoatmega328

[env:nano_new]
board = nanoatmega328new
