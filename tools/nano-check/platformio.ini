; Sanity check for the Arduino Nano we use as a USB-to-serial adapter.
; Most clones ship with the old bootloader (57600 baud upload). If upload
; fails with "not in sync" on one env, try the other.

[platformio]
default_envs = nano_old

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:nano_old]
board = nanoatmega328

[env:nano_new]
board = nanoatmega328new
