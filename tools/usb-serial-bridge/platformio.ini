; Turns our ATmega32U4 Nano into a USB-to-serial adapter for flashing the
; WT32-ETH01. A 32U4 has native USB, so the classic "hold RESET to GND" trick
; would turn off USB too; this sketch forwards bytes in software instead.

[platformio]
default_envs = nano_32u4

[env:nano_32u4]
platform = atmelavr
framework = arduino
board = leonardo
monitor_speed = 115200
