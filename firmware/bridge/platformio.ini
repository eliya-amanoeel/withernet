; withernet bridge firmware for the WT32-ETH01.
; ESP-IDF, not Arduino: the bridge uses low-level Wi-Fi calls (esp_wifi_internal_*)
; that are undocumented and have changed between IDF versions, so the platform
; version is pinned. Don't upgrade it without re-running the bench test.

; Shared by both dongles. Each dongle has its own env below with its fixed
; management IP: build with `pio run -e checkwatt` or `pio run -e nibe`.
[env]
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
monitor_speed = 115200
; Flashing goes through the Nano, see docs/01-flashing.md for both settings.
upload_speed = 115200
board_upload.before_reset = no_reset
; Two OTA slots, see partitions.csv.
board_build.partitions = partitions.csv

; Management IPs: .2-.9 is the block for network devices (see handoff.md).
[env:nibe]
build_flags = '-DMGMT_IP="192.168.68.2"' '-DBOARD_NAME="nibe"'

[env:checkwatt]
build_flags = '-DMGMT_IP="192.168.68.3"' '-DBOARD_NAME="checkwatt"'
