; withernet bridge firmware for the WT32-ETH01.
; ESP-IDF, not Arduino: the bridge uses low-level Wi-Fi calls (esp_wifi_internal_*)
; that are undocumented and have changed between IDF versions, so the platform
; version is pinned. Don't upgrade it without re-running the bench test.

[env:wt32-eth01]
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
monitor_speed = 115200
; Flashing goes through the Nano, see docs/01-flashing.md for both settings.
upload_speed = 115200
board_upload.before_reset = no_reset
