; withernet bridge firmware for the WT32-ETH01.
; ESP-IDF, not Arduino: the bridge uses low-level Wi-Fi calls (esp_wifi_internal_*)
; that are undocumented and have changed between IDF versions, so the platform
; version is pinned. Don't upgrade it without re-running the bench test.

[env:wt32-eth01]
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
monitor_speed = 115200
; The Nano bridge can't do 921600, and on the PC only 115200 works, see docs/01-flashing.md.
upload_speed = 115200
; The Nano drops data to the PC while DTR/RTS are low, and esptool's default reset
; leaves them low. The reset is manual (IO0 jumper) anyway.
board_upload.before_reset = no_reset
