; Firmware for the WT32-ETH01 dongle.
; Uses pioarduino (Arduino core 3.x) instead of PlatformIO's stock espressif32,
; which is stuck on core 2.x; we need 3.x later for NAT routing.
;
; Flash with env "serial", through the Nano on COM6 with IO0 jumpered to GND.
; (OTA over Wi-Fi is a future feature; the Wi-Fi link was too lossy for it.)
;
; The Wi-Fi password lives in secrets.ini (git-ignored); copy
; secrets.example.ini to secrets.ini and fill it in.

[platformio]
default_envs = serial
extra_configs = secrets.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = wt32-eth01
monitor_speed = 115200
build_flags =
  '-DWIFI_SSID="${secrets.wifi_ssid}"'
  '-DWIFI_PASS="${secrets.wifi_pass}"'

[env:serial]
upload_port = COM6
; The Nano's 16 MHz clock is 8.5% off at 460800 (and 3.5% at 230400); only
; 115200 is reliable against a real ESP32.
upload_speed = 115200
; The "reset" is replaced by esptool.cfg, see there.
monitor_port = COM6
; The Nano only passes data on to the PC while DTR is on (see esptool.cfg).
monitor_dtr = 1
