# esptool reads this from the working directory.
# Our Nano (ATmega32U4) only passes the ESP's replies on to the PC while DTR is
# on, and esptool 5 turns DTR off when it opens the port on Windows. So instead
# of a reset (the IO0 jumper does that job), just turn DTR back on.
[esptool]
custom_reset_sequence = D1
